    /* ==================== */
    /* CSS VARIABLES        */
    /* ==================== */
    :root {
      /* Dark theme (default) */
      --color-bg-dark: #181818;
      --color-bg-secondary: #323232;
      --color-text-light: #ffe7d0;
      --color-text-muted: rgba(255, 231, 208, 0.85);
      --color-accent: #fc6e20;
      --color-accent-glow: rgba(252, 110, 32, 0.35);
      --gradient-primary: linear-gradient(135deg, #fc6e20 0%, #ff8c42 100%);
      --gradient-bg: linear-gradient(180deg, #181818 0%, #1f1f1f 100%);
      --shadow-card: 0 10px 40px rgba(0, 0, 0, 0.4);
      --shadow-accent: 0 8px 30px var(--color-accent-glow);
      --transition-smooth: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-color-light: rgba(255, 255, 255, 0.15);
      --input-bg: rgba(24, 24, 24, 0.7);
      --card-bg: rgba(50, 50, 50, 0.4);
      --card-bg-hover: rgba(50, 50, 50, 0.6);
      --header-bg: rgba(24, 24, 24, 0.95);
      --hero-glow: rgba(252, 110, 32, 0.15);
      --faq-glow: rgba(252, 110, 32, 0.06);
      --final-cta-glow: rgba(252, 110, 32, 0.12);
      --overlay-dark: rgba(24, 24, 24, 0.85);
      --overlay-light: rgba(255, 255, 255, 0.92);
      --font-main: 'Montserrat', sans-serif;
    }

    [data-theme="light"] {
      /* Light theme */
      --color-bg-dark: #ffffff;
      --color-bg-secondary: #f5f5f5;
      --color-text-light: #181818;
      --color-text-muted: rgba(24, 24, 24, 0.75);
      --color-accent: #fc6e20;
      --color-accent-glow: rgba(252, 110, 32, 0.25);
      --gradient-bg: linear-gradient(180deg, #ffffff 0%, #f8f8f8 100%);
      --shadow-card: 0 10px 40px rgba(0, 0, 0, 0.12);
      --border-color: rgba(0, 0, 0, 0.08);
      --border-color-light: rgba(0, 0, 0, 0.15);
      --input-bg: #f5f5f5;
      --card-bg: rgba(245, 245, 245, 0.8);
      --card-bg-hover: rgba(240, 240, 240, 0.9);
      --header-bg: rgba(255, 255, 255, 0.95);
      --hero-glow: rgba(252, 110, 32, 0.08);
      --faq-glow: rgba(252, 110, 32, 0.04);
      --final-cta-glow: rgba(252, 110, 32, 0.06);
      --overlay-dark: rgba(255, 255, 255, 0.92);
      --overlay-light: rgba(24, 24, 24, 0.08);
    }

    /* ==================== */
    /* RESET & BASE         */
    /* ==================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-main);
      background: var(--gradient-bg);
      color: var(--color-text-light);
      line-height: 1.7;
      overflow-x: hidden;
      transition: background 0.4s ease, color 0.4s ease;
    }

    a {
      text-decoration: none;
      color: inherit;
      transition: var(--transition-smooth);
    }

    ul {
      list-style: none;
    }

    img {
      max-width: 100%;
      display: block;
    }
